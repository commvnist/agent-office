name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
        include: # the oldest supported Node: TypeScript needs the strip-types flag there (inherited by spawned daemons)
          - { os: ubuntu-latest, node: 22.6.0, flags: --experimental-strip-types }
    env: { NODE_OPTIONS: "${{ matrix.flags }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run check:compliance
      - run: npm run build:web
  perf: # P6 gate: update p95 (and frame p95 where rendering keeps up) and display objects at 100 agents, 4x CPU throttling (scripts/perf.mjs; Chrome ships on the runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build:web
      - run: npm run perf
        env: { PERF_SECONDS: "30" } # a GPU-less runner renders ~3 fps: sample long enough for a stable p95
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
